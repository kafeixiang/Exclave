name: Release Build
on:
  push:
    branches:
      - dev*
    paths:
      - "app/**"
      - "buildSrc/**"
      - "library/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache-dependency-path: "library/core/go.sum"
      - name: Setup Go Mobile
        # https://github.com/golang/mobile/blob/c31d5b91ecc32c0d598b8fe8457d244ca0b4e815/cmd/gomobile/init.go#L83
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260821190718-4776eadac327
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
      - name: Native Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./run lib core
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: app/libs/libexclavecore.aar
          name: "LibExclaveCore"
      - name: Gradle Cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export KEYSTORE_PASS="${{ secrets.KEYSTORE_PASS }}"
          export ALIAS_NAME="${{ secrets.ALIAS_NAME }}"
          export ALIAS_PASS="${{ secrets.ALIAS_PASS }}"
          ./gradlew :app:downloadAssets
          ./gradlew :app:assembleOssRelease :app:assembleLegacyRelease
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APKs
          path: app/build/outputs/apk/oss/release
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APKs-legacy
          path: app/build/outputs/apk/legacy/release
  publish:
    name: Publish Release
    if: github.event.inputs.release != 'y'
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: APKs
          path: artifacts
      - name: Set Release Tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d'=' -f2 | tr -d '\r')
            BRANCH_NAME="${GITHUB_REF_NAME}"
            TAG_NAME="${BRANCH_NAME}-${VERSION_NAME}"
            echo "RELEASE_TAG=${TAG_NAME}" >> $GITHUB_ENV
          fi
      - name: Publish Release
        if: github.event.inputs.prerelease != 'y'
        run: |
          mkdir apks
          find artifacts -name "*.apk" -exec cp {} apks \;
          gh release create "${{ env.RELEASE_TAG }}" --title "${{ env.RELEASE_TAG }}" --prerelease \
            --notes $'# :memo: Release Notes\n\n* Fixes and improvements.' || echo "Release already exists"
          gh release upload "${{ env.RELEASE_TAG }}" ./apks/* --clobber